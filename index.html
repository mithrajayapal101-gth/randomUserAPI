<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center text-primary">Random User Generator</h1>
        <div class="d-flex justify-content-center align-items-center my-5">
            <input type="number" id="count" placeholder="Enter number of users" class="form-control w-25">
            <button id="generate" class="btn btn-primary mx-2">Generate Users</button>
        </div>
        <div id="userdetails" class="row g-4"></div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
